<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Punch</title>
        <link rel="manifest" href="manifest.webmanifest" />
        <link rel="icon" href="icon.svg" type="image/svg+xml" />
        <meta name="theme-color" content="#111214" />
        <script src="https://accounts.google.com/gsi/client" async></script>
        <style>
            :root {
                --bg: #f6f6f7;
                --card: #ffffff;
                --text: #16171a;
                --muted: #75787e;
                --line: #e3e4e7;
                --accent: #6b7280;
                color-scheme: light dark;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #111214;
                    --card: #191b1e;
                    --text: #f2f3f5;
                    --muted: #8b8f96;
                    --line: #26282c;
                }
            }
            body.working {
                --accent: #16a34a;
            }
            body.break {
                --accent: #d97706;
            }
            @media (prefers-color-scheme: dark) {
                body.working {
                    --accent: #22c55e;
                }
                body.break {
                    --accent: #f59e0b;
                }
            }

            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: max(16px, env(safe-area-inset-top)) 16px
                    calc(24px + env(safe-area-inset-bottom));
                max-width: 480px;
                margin-inline: auto;
                background: var(--bg);
                color: var(--text);
                font:
                    16px/1.5 -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    system-ui,
                    sans-serif;
                -webkit-tap-highlight-color: transparent;
            }

            .card {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 18px;
                padding: 22px 20px;
            }

            .top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 18px;
            }
            .date {
                font-size: 15px;
                color: var(--muted);
            }
            .status {
                display: flex;
                align-items: center;
                gap: 7px;
                font-size: 13px;
                color: var(--accent);
                font-weight: 600;
            }
            .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--accent);
            }
            body.working .dot {
                animation: pulse 2s ease-in-out infinite;
            }
            @keyframes pulse {
                50% {
                    opacity: 0.35;
                }
            }

            .net {
                font:
                    600 46px/1.1 ui-monospace,
                    SFMono-Regular,
                    "SF Mono",
                    Menlo,
                    monospace;
                letter-spacing: -1.5px;
                font-variant-numeric: tabular-nums;
            }
            .sub {
                margin-top: 10px;
                display: flex;
                gap: 18px;
                font-size: 14px;
                color: var(--muted);
            }
            .sub b {
                font-weight: 600;
                color: var(--text);
                font-variant-numeric: tabular-nums;
            }

            /* Leave-at block: divider + list, so it reads as its own answer
               rather than a fourth elapsed-time stat. */
            #leave {
                margin-top: 18px;
                padding-top: 14px;
                border-top: 1px solid var(--line);
            }
            .leaveHead {
                font-size: 12px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: var(--muted);
            }
            .leaveHead b {
                color: var(--accent);
            }
            .leaveList {
                list-style: none;
                margin: 10px 0 0;
                padding: 0;
                display: grid;
                gap: 8px;
            }
            .leaveList li {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 12px;
                font-size: 14px;
                color: var(--muted);
            }
            .leaveList b {
                font-weight: 600;
                font-size: 18px;
                color: var(--text);
                font-variant-numeric: tabular-nums;
            }

            /* Pinned so the punch buttons stay under the thumb, however long the day gets.
     Fixed, not sticky: sticky only pins once the page overflows, and a fresh day is short. */
            .actions {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 1;
                max-width: 480px;
                margin-inline: auto;
                display: grid;
                gap: 10px;
                padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
                background: var(--bg);
                border-top: 1px solid var(--line);
            }
            #todayView {
                padding-bottom: 150px;
            } /* room for the bar over the last list row */
            button {
                font: inherit;
                font-weight: 600;
                border-radius: 14px;
                padding: 16px;
                border: 1px solid var(--line);
                background: transparent;
                color: var(--text);
                cursor: pointer;
                transition: transform 0.08s;
            }
            button:active {
                transform: scale(0.98);
            }
            button.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }

            h2 {
                font-size: 13px;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: var(--muted);
                margin: 30px 0 8px 4px;
            }

            .tabs {
                display: flex;
                gap: 6px;
                margin-bottom: 14px;
            }
            .tabs button {
                flex: 1;
                padding: 10px;
                font-size: 14px;
                color: var(--muted);
            }
            .tabs button[aria-current] {
                color: var(--accent);
                border-color: var(--accent);
            }

            #add {
                width: 100%;
                margin-bottom: 4px;
                padding: 13px;
                font-size: 14px;
            }

            details {
                border-bottom: 1px solid var(--line);
            }
            summary {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 12px;
                padding: 14px 4px;
                cursor: pointer;
                list-style: none;
            }
            summary::-webkit-details-marker {
                display: none;
            }
            summary .d {
                font-weight: 500;
            }
            summary .n {
                font-variant-numeric: tabular-nums;
                font-weight: 600;
            }
            summary .g {
                font-size: 13px;
                color: var(--muted);
                font-variant-numeric: tabular-nums;
            }
            .evs {
                padding: 2px 4px 14px;
                display: grid;
                gap: 2px;
            }
            .ev {
                display: flex;
                gap: 12px;
                align-items: center;
                width: 100%;
                background: none;
                border: 0;
                padding: 9px 8px;
                border-radius: 10px;
                font-size: 14px;
                color: var(--muted);
                text-align: left;
                font-weight: 400;
            }
            button.ev:hover {
                background: var(--bg);
            }
            .ev time {
                font-variant-numeric: tabular-nums;
                color: var(--text);
                font-weight: 600;
                min-width: 76px;
            }
            .ev .pen {
                margin-left: auto;
                opacity: 0.45;
                font-size: 12px;
            }

            .empty {
                color: var(--muted);
                font-size: 14px;
                padding: 14px 4px;
            }

            .tools {
                display: flex;
                gap: 10px;
                margin-top: 28px;
            }
            .tools button {
                flex: 1;
                padding: 11px;
                font-size: 13px;
                font-weight: 500;
                color: var(--muted);
            }
            .version {
                margin-top: 12px;
                text-align: center;
                font-size: 12px;
                color: var(--muted);
            }

            dialog {
                border: 0;
                border-radius: 18px;
                padding: 20px;
                width: min(340px, calc(100vw - 32px));
                background: var(--card);
                color: var(--text);
            }
            dialog::backdrop {
                background: #000a;
            }
            dialog h3 {
                margin: 0 0 14px;
                font-size: 16px;
            }
            dialog input,
            dialog select {
                font: inherit;
                width: 100%;
                padding: 12px;
                border-radius: 12px;
                border: 1px solid var(--line);
                background: var(--bg);
                color: var(--text);
            }
            dialog select {
                margin-bottom: 10px;
            }
            .row {
                display: flex;
                gap: 10px;
                margin-top: 16px;
            }
            .row button {
                flex: 1;
                padding: 13px;
            }
            .danger {
                color: #dc2626;
                border-color: #dc262633;
            }

            #cloudView .card {
                display: grid;
                gap: 12px;
            }
            #cloudView p {
                margin: 0;
                font-size: 14px;
                color: var(--muted);
            }
            #cloudView a {
                color: var(--accent);
            }
            #cloudView button {
                width: 100%;
            }
            #cloudMsg:empty {
                display: none;
            }
            #cloudMsg {
                font-size: 14px;
                padding: 12px 14px;
                border-radius: 12px;
                background: var(--bg);
            }
        </style>
    </head>
    <body>
        <div class="tabs">
            <button id="tabToday" aria-current="page">Today</button>
            <button id="tabHistory">History</button>
            <button id="tabCloud">Cloud</button>
        </div>

        <div id="todayView">
            <div class="card">
                <div class="top">
                    <span class="date" id="date"></span>
                    <span class="status"
                        ><span class="dot"></span><span id="stateLabel"></span
                    ></span>
                </div>
                <div class="net" id="net">0h 00m</div>
                <div class="sub">
                    <span>in office <b id="gross">0h 00m</b></span>
                    <span>breaks <b id="breaks">0h 00m</b></span>
                </div>
                <div id="leave" hidden>
                    <div class="leaveHead">Leave at <b>8h</b></div>
                    <ul class="leaveList">
                        <li>
                            <span>including break</span>
                            <b id="leaveGross">—</b>
                        </li>
                        <li>
                            <span>excluding break</span>
                            <b id="leaveNet">—</b>
                        </li>
                    </ul>
                </div>
            </div>

            <h2>Punches</h2>
            <div id="todayEvents"></div>

            <div class="actions" id="actions"></div>
        </div>

        <div id="historyView" hidden>
            <button id="add">+ Add entry</button>
            <div id="history"></div>

            <div class="tools">
                <button id="exportCsv">Export CSV</button>
                <button id="export">Export JSON</button>
                <button id="import">Import</button>
            </div>
            <div class="version">Punch v3.1</div>
        </div>

        <div id="cloudView" hidden>
            <div class="card" id="cloud"></div>
            <div id="cloudMsg"></div>
        </div>

        <dialog id="editor">
            <h3 id="editorTitle">Edit time</h3>
            <select id="editorKind"></select>
            <input type="datetime-local" id="editorInput" />
            <div class="row">
                <button class="danger" id="editorDelete">Delete</button>
                <button id="editorCancel">Cancel</button>
                <button class="primary" id="editorSave">Save</button>
            </div>
        </dialog>

        <script type="module">
            import {
                shifts,
                totals,
                leaveAt,
                nextActions,
                state,
                fmt,
                dayKey,
                toCSV,
                fromCSV,
                toRows,
                fromRows,
                KINDS,
            } from "./punch.js";

            const KEY = "punch.events";
            const TARGET = 8 * 3600000;
            const LABEL = {
                in: "Punch In",
                bin: "Break In",
                bout: "Break Out",
                out: "Punch Out",
            };
            const STATE_TEXT = {
                working: "Working",
                break: "On break",
                off: "Punched out",
            };
            const $ = (id) => document.getElementById(id);

            const load = () => {
                try {
                    return JSON.parse(localStorage.getItem(KEY)) ?? [];
                } catch {
                    return [];
                }
            };
            const save = (evs) => {
                events = [...evs].sort((a, b) => a.t - b.t);
                localStorage.setItem(KEY, JSON.stringify(events));
                render();
            };

            let events = load();
            let ticker = null;

            const clock = (t) =>
                new Date(t).toLocaleTimeString([], {
                    hour: "numeric",
                    minute: "2-digit",
                    hour12: true,
                });
            const dayName = (t) =>
                new Date(t).toLocaleDateString([], {
                    weekday: "short",
                    day: "numeric",
                    month: "short",
                });

            // datetime-local wants a local "yyyy-MM-ddTHH:mm" string, not an ISO/UTC one.
            const toInput = (t) =>
                new Date(t - new Date(t).getTimezoneOffset() * 60000)
                    .toISOString()
                    .slice(0, 16);

            function render() {
                const all = shifts(events);
                const last = events.length ? events[events.length - 1].k : null;
                const st = state(last);
                document.body.className = st;
                $("stateLabel").textContent = STATE_TEXT[st];

                // Top card shows the newest shift while it is open or started today; else today, empty.
                const current =
                    all[0] &&
                    (totals(all[0]).open || all[0].date === dayKey(Date.now()))
                        ? all[0]
                        : null;
                $("date").textContent = dayName(
                    current ? current.start : Date.now(),
                );

                $("actions").replaceChildren(
                    ...nextActions(last).map((k, i) => {
                        const b = document.createElement("button");
                        b.textContent = LABEL[k];
                        b.className =
                            k === "out" ? "danger" : i === 0 ? "primary" : "";
                        b.onclick = () =>
                            save([...events, { t: Date.now(), k }]);
                        return b;
                    }),
                );

                renderToday(current);
                renderHistory(all);
                tick(current);

                clearInterval(ticker);
                ticker =
                    current && totals(current).open
                        ? setInterval(() => tick(current), 1000)
                        : null;
            }

            function tick(current) {
                const r = current
                    ? totals(current)
                    : { gross: 0, breaks: 0, net: 0 };
                $("net").textContent = fmt(r.net);
                $("gross").textContent = fmt(r.gross);
                $("breaks").textContent = fmt(r.breaks);

                const l =
                    current && totals(current).open
                        ? leaveAt(current, TARGET)
                        : null;
                $("leave").hidden = !l;
                if (l) {
                    $("leaveGross").textContent = clock(l.gross);
                    $("leaveNet").textContent = clock(l.net);
                }
            }

            // Read-only: History is where times get fixed.
            // Shows the shift the card is measuring, so the list and the totals can never disagree —
            // a day with two separate punch-in/punch-out shifts shows the newest here, all of them in History.
            function renderToday(current) {
                const host = $("todayEvents");
                if (!current) {
                    host.innerHTML =
                        '<div class="empty">Nothing logged today.</div>';
                    return;
                }
                host.replaceChildren(
                    ...current.events.map((e) => {
                        const row = document.createElement("div");
                        row.className = "ev";
                        row.innerHTML = `<time>${clock(e.t)}</time><span>${KINDS[e.k]}</span>`;
                        return row;
                    }),
                );
            }

            function renderHistory(past) {
                const host = $("history");
                if (!past.length) {
                    host.innerHTML =
                        '<div class="empty">Nothing logged yet.</div>';
                    return;
                }
                host.replaceChildren(
                    ...past.map((s) => {
                        const r = totals(s);
                        const d = document.createElement("details");
                        d.innerHTML = `<summary>
        <span class="d">${dayName(s.start)}</span>
        <span><span class="n">${fmt(r.net)}</span> <span class="g">/ ${fmt(r.gross)}</span></span>
      </summary>`;
                        const evs = document.createElement("div");
                        evs.className = "evs";
                        evs.replaceChildren(
                            ...s.events.map((e) => {
                                const b = document.createElement("button");
                                b.className = "ev";
                                b.innerHTML = `<time>${clock(e.t)}</time><span>${KINDS[e.k]}</span><span class="pen">edit</span>`;
                                b.onclick = () => openEditor(e);
                                return b;
                            }),
                        );

                        // Inside the expanded day, so wiping a day takes an open + a confirm, not one stray tap.
                        const del = document.createElement("button");
                        del.className = "ev danger";
                        del.innerHTML = `<span>Delete this day</span>`;
                        del.onclick = () => {
                            if (
                                !confirm(
                                    `Delete ${dayName(s.start)} — ${s.events.length} entries?`,
                                )
                            )
                                return;
                            save(events.filter((e) => !s.events.includes(e)));
                        };
                        evs.append(del);

                        d.append(evs);
                        return d;
                    }),
                );
            }

            // ev === null means "add a new entry" — the backfill path for a punch or break
            // that never got recorded. Deliberately skips the nextActions state machine:
            // that guards the buttons, this repairs a log the buttons could not produce.
            function openEditor(ev) {
                const dlg = $("editor");
                $("editorTitle").textContent = ev ? KINDS[ev.k] : "Add entry";
                $("editorKind").value = ev ? ev.k : "in";
                $("editorInput").value = toInput(ev ? ev.t : Date.now());
                $("editorDelete").hidden = !ev;
                $("editorSave").onclick = () => {
                    const t = new Date($("editorInput").value).getTime();
                    const k = $("editorKind").value;
                    if (Number.isNaN(t)) return;
                    if (ev) {
                        ev.t = t;
                        ev.k = k;
                        save(events);
                    } else save([...events, { t, k }]);
                    dlg.close();
                };
                $("editorDelete").onclick = () => {
                    save(events.filter((x) => x !== ev));
                    dlg.close();
                };
                $("editorCancel").onclick = () => dlg.close();
                dlg.showModal();
            }

            $("editorKind").replaceChildren(
                ...Object.entries(KINDS).map(([k, label]) => {
                    const o = document.createElement("option");
                    o.value = k;
                    o.textContent = label;
                    return o;
                }),
            );

            $("add").onclick = () => openEditor(null);

            const TABS = ["today", "history", "cloud"];

            function showTab(name) {
                for (const t of TABS) {
                    $(`${t}View`).hidden = t !== name;
                    const tab = $(`tab${t[0].toUpperCase()}${t.slice(1)}`);
                    if (t === name) tab.setAttribute("aria-current", "page");
                    else tab.removeAttribute("aria-current");
                }
                if (name === "cloud") renderCloud();
            }
            for (const t of TABS)
                $(`tab${t[0].toUpperCase()}${t.slice(1)}`).onclick = () =>
                    showTab(t);

            function download(ext, text, type) {
                const a = document.createElement("a");
                a.href = URL.createObjectURL(new Blob([text], { type }));
                a.download = `punch-${dayKey(Date.now())}.${ext}`;
                a.click();
                URL.revokeObjectURL(a.href);
            }

            // CSV for the timesheet, JSON for the exact backup (CSV rounds to the minute).
            $("exportCsv").onclick = () =>
                download("csv", toCSV(events), "text/csv");
            $("export").onclick = () =>
                download("json", JSON.stringify(events), "application/json");

            $("import").onclick = () => {
                const f = document.createElement("input");
                f.type = "file";
                f.accept = ".csv,application/json";
                f.onchange = async () => {
                    const file = f.files[0];
                    const text = await file.text();
                    let incoming;

                    if (file.name.toLowerCase().endsWith(".csv")) {
                        incoming = fromCSV(text);
                        if (!incoming) return alert("Not a punch CSV.");
                    } else {
                        try {
                            incoming = JSON.parse(text);
                        } catch {
                            incoming = null;
                        }
                        if (
                            !Array.isArray(incoming) ||
                            !incoming.every(
                                (e) => typeof e?.t === "number" && e.k in KINDS,
                            )
                        ) {
                            return alert("Not a punch backup file.");
                        }
                    }

                    if (
                        !confirm(
                            `Replace ${events.length} events with ${incoming.length} from the file?`,
                        )
                    )
                        return;
                    save(incoming);
                };
                f.click();
            };

            // --- Google Sheets backup (optional) -----------------------------------------
            // Own-your-data sync: the app creates one spreadsheet in the user's Drive and mirrors the
            // log into it. drive.file is non-sensitive and only reaches files this app created, so no
            // Google verification is needed — which is also why we create the sheet instead of letting
            // you point at an existing one.

            const CLIENT_ID =
                "1059280511639-7rvl8ueuhvd1it91ujtjf6l366igomir.apps.googleusercontent.com";
            const SHEET_KEY = "punch.sheet";
            const SHEET_NAME = "Punch log";
            const API = "https://sheets.googleapis.com/v4/spreadsheets";
            const DRIVE = "https://www.googleapis.com/drive/v3/files";

            const loadSheet = () => {
                try {
                    return JSON.parse(localStorage.getItem(SHEET_KEY));
                } catch {
                    return null;
                }
            };
            const saveSheet = (s) => {
                if (s) localStorage.setItem(SHEET_KEY, JSON.stringify(s));
                else localStorage.removeItem(SHEET_KEY);
                renderCloud();
            };

            // Token lives in memory only — a bearer token in localStorage is one XSS away from being
            // someone else's. Every sync is a button press, so re-requesting costs nothing.
            let token = null;
            let tokenExpiry = 0;
            let tokenClient = null;

            function auth() {
                if (token && Date.now() < tokenExpiry)
                    return Promise.resolve(token);
                return new Promise((resolve, reject) => {
                    tokenClient ??= google.accounts.oauth2.initTokenClient({
                        client_id: CLIENT_ID,
                        scope: "https://www.googleapis.com/auth/drive.file",
                        callback: () => {},
                    });
                    tokenClient.callback = (r) => {
                        if (r.error) return reject(new Error(r.error));
                        token = r.access_token;
                        tokenExpiry = Date.now() + (r.expires_in - 60) * 1000;
                        resolve(token);
                    };
                    tokenClient.error_callback = () =>
                        reject(new Error("Sign-in was cancelled."));
                    tokenClient.requestAccessToken({ prompt: "" }); // silent once the grant exists
                });
            }

            async function req(url, { method = "GET", body } = {}, retry = true) {
                const res = await fetch(url, {
                    method,
                    headers: {
                        Authorization: `Bearer ${await auth()}`,
                        "Content-Type": "application/json",
                    },
                    body: body && JSON.stringify(body),
                });
                // Revoked or expired early: drop the cached token and ask for a fresh one, once.
                if (res.status === 401 && retry) {
                    token = null;
                    return req(url, { method, body }, false);
                }
                if (!res.ok)
                    throw Object.assign(new Error(`Google API ${res.status}`), {
                        status: res.status,
                    });
                return res.json();
            }
            const api = (path, opts) => req(`${API}${path}`, opts);

            const msg = (text) => {
                $("cloudMsg").textContent = text;
            };

            // A sheet the user trashed is not an error worth retrying — drop back to disconnected so
            // the next tap makes a fresh one.
            function handle(err, sheet) {
                if (err.status === 404 && sheet) {
                    saveSheet(null);
                    return msg(
                        "That sheet is gone from Drive. Connect again to start a new one.",
                    );
                }
                msg(
                    err.message === "Sign-in was cancelled."
                        ? err.message
                        : `Sync failed: ${err.message}`,
                );
            }

            // Which sheet is "yours" was only ever recorded in localStorage, so a second device — or
            // one whose site data got cleared — had no way to know and made another sheet. Drive is
            // the durable record, so ask it first. drive.file scopes the search to files this app
            // created, so this can never match an unrelated spreadsheet.
            // ponytail: matched by name — rename it in Drive and the next connect starts a fresh one.
            // Tagging with appProperties would survive a rename, at the cost of an extra write.
            async function findSheet() {
                const params = new URLSearchParams({
                    q: `name='${SHEET_NAME}' and trashed=false`,
                    orderBy: "modifiedTime desc",
                    fields: "files(id)",
                });
                const { files } = await req(`${DRIVE}?${params}`);
                return files?.[0]?.id ?? null;
            }

            async function connect() {
                msg("Looking for your sheet…");
                try {
                    const found = await findSheet();
                    if (found) {
                        // Deliberately no push: this device may be empty, and the sheet is not.
                        // Overwriting someone's history because they reinstalled is not a sync.
                        saveSheet({ id: found, synced: 0 });
                        return msg(
                            `Reconnected to your existing ${SHEET_NAME}. Pull from sheet to load it onto this device, or Sync now to replace it with what is here.`,
                        );
                    }
                    msg("Creating your sheet…");
                    const { spreadsheetId } = await api("", {
                        method: "POST",
                        body: { properties: { title: SHEET_NAME } },
                    });
                    saveSheet({ id: spreadsheetId, synced: 0 });
                    await push();
                } catch (err) {
                    handle(err);
                }
            }

            // Clear then write the whole log: a few hundred rows a year, one round trip, and it is the
            // only thing that removes rows for a day deleted locally.
            async function push() {
                const sheet = loadSheet();
                if (!sheet) return;
                msg("Syncing…");
                try {
                    await api(`/${sheet.id}/values/A:C:clear`, {
                        method: "POST",
                        body: {},
                    });
                    await api(`/${sheet.id}/values/A1?valueInputOption=RAW`, {
                        method: "PUT",
                        body: { values: toRows(events) },
                    });
                    saveSheet({ ...sheet, synced: Date.now() });
                    msg(`Sheet updated — ${events.length} events.`);
                } catch (err) {
                    handle(err, sheet);
                }
            }

            async function pull() {
                const sheet = loadSheet();
                if (!sheet) return;
                msg("Reading sheet…");
                try {
                    const { values } = await api(`/${sheet.id}/values/A:C`);
                    const incoming = fromRows(values);
                    if (!incoming)
                        return msg(
                            "That sheet doesn't look like a punch log — nothing was changed.",
                        );
                    if (
                        !confirm(
                            `Replace ${events.length} events with ${incoming.length} from the sheet?`,
                        )
                    )
                        return msg("");
                    save(incoming);
                    msg(`Loaded ${incoming.length} events from the sheet.`);
                } catch (err) {
                    handle(err, sheet);
                }
            }

            function renderCloud() {
                const host = $("cloud");
                const sheet = loadSheet();
                host.replaceChildren();
                msg(""); // every caller that wants a message sets it after this runs

                const add = (html) =>
                    host.insertAdjacentHTML("beforeend", html);
                const btn = (text, fn, cls = "") => {
                    const b = document.createElement("button");
                    b.textContent = text;
                    b.className = cls;
                    b.onclick = fn;
                    host.append(b);
                };

                // The GIS script is cross-origin, so it is simply absent offline. Say so rather than throw.
                if (!window.google?.accounts?.oauth2) {
                    return add(
                        "<p>Google sign-in needs a connection. Punching works offline — come back when you are online.</p>",
                    );
                }
                if (CLIENT_ID.startsWith("PASTE_")) {
                    return add(
                        "<p>No Google client ID set yet. Add one in <code>index.html</code> to use this tab.</p>",
                    );
                }

                if (!sheet) {
                    add(
                        "<p>Keep a copy of your log in a spreadsheet in your own Google Drive. The app creates the sheet and can only touch that one file.</p>",
                    );
                    btn("Connect Google account", connect, "primary");
                    return;
                }

                add(`<p>Backing up to <a href="https://docs.google.com/spreadsheets/d/${sheet.id}" target="_blank" rel="noopener">${SHEET_NAME}</a>
       — ${sheet.synced ? `last synced ${dayName(sheet.synced)}, ${clock(sheet.synced)}` : "not synced yet"}.</p>`);
                btn("Sync now", push, "primary");
                btn("Pull from sheet", pull);
                btn(
                    "Disconnect",
                    () => {
                        if (
                            !confirm(
                                "Stop syncing? The sheet stays in your Drive.",
                            )
                        )
                            return;
                        token = null;
                        saveSheet(null);
                        msg("Disconnected. Your sheet is untouched in Drive.");
                    },
                    "danger",
                );
            }

            render();
            navigator.storage?.persist?.(); // ask Chrome not to evict the log
            navigator.serviceWorker?.register("sw.js");
        </script>
    </body>
</html>
